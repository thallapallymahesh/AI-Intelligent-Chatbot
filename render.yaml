services:
  - type: web
    name: ai-intelligent-chatbot-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Render Free storage is ephemeral; uploads, SQLite, and Chroma data can be lost on restart.
      - key: APP_DATA_DIR
        value: /tmp/chatbot-data
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: AI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_EMBEDDING_MODEL
        value: gemini-embedding-2
      # Public demo API; no cookies or credentialed CORS requests are used.
      - key: CORS_ORIGINS
        value: https://ai-intelligent-chatbot.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Set this secret only if a valid free-tier Gemini API key is available.
      - key: AI_API_KEY
        sync: false
